name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (C)
    runs-on: ubuntu-24.04
    container: debian:trixie
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkgconf gnulib \
            libgtk-4-dev git ca-certificates
      - uses: actions/checkout@v7
      - name: Bootstrap and configure
        run: |
          ./bootstrap
          ./configure
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality
      - name: Build
        run: make -j"$(nproc)" check TESTS=
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
