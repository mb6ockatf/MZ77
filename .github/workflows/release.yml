name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkgconf gnulib \
            libgtk-4-dev git ca-certificates
      - uses: actions/checkout@v7
      - name: Bootstrap
        run: ./bootstrap
      - name: Configure
        run: ./configure
      - name: Check the tag against the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(./configure --version | sed -n '1s/.* //p')
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match version $version in configure.ac" >&2
            exit 1
          fi
      - name: make distcheck
        run: make -j"$(nproc)" distcheck
      - name: Checksum
        run: sha256sum mz77-*.tar.gz >SHA256SUMS
      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            mz77-*.tar.gz
            SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
